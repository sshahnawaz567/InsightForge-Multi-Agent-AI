version: '3.8'

services:
  #PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: insightforge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: insightforge_password
      POSTGRES_DB: insightforge
    ports:
      - "5432:5432"

    volumes:
      # Persist database data
      - postgres_data:/var/lib/postgresql/data
      # Initialize schema on first run
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insightforge-network
  
  redis:
    image: redis:7-alpine
    container_name: insightforge-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insightforge-network

  # InsightForge Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insightforge-backend
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:insightforge_password@postgres:5432/insightforge
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      
      # OpenAI (from .env file or set here)
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # Pinecone (optional)
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_ENVIRONMENT: ${PINECONE_ENVIRONMENT}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME}
      
      # Python
      PYTHONUNBUFFERED: 1
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount code for development (hot reload)
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    networks:
      - insightforge-network
    restart: unless-stopped

  # Nginx (serves frontend + reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: insightforge-nginx
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - insightforge-network
    restart: unless-stopped

  # Volumes for data persistence
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# Network for inter-container communication
networks:
  insightforge-network:
    driver: bridge

