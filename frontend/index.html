<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightForge - AI Business Intelligence</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        /* Main Content */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        /* Query Section */
        .query-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .query-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* Examples */
        .examples {
            margin-top: 20px;
        }

        .examples h3 {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        .example-btn {
            background: #f5f5f5;
            color: #667eea;
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #e0e0e0;
            font-size: 0.9em;
            margin: 5px;
            cursor: pointer;
            display: inline-block;
        }

        .example-btn:hover {
            background: #667eea;
            color: white;
        }

        /* Results Section */
        .results-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-height: 80vh;
            overflow-y: auto;
        }

        .results-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Agent Status */
        .agent-status {
            display: none;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .agent-status.active {
            display: block;
        }

        .agent-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
        }

        .agent-item .icon {
            margin-right: 10px;
            font-size: 1.2em;
        }

        .agent-item.completed {
            color: #28a745;
        }

        /* Results Display */
        .result-card {
            display: none;
            animation: fadeIn 0.5s;
        }

        .result-card.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .metric-change {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }

        .metric-change h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .metric-value {
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
        }

        .metric-value.negative {
            color: #dc3545;
        }

        .metric-value.positive {
            color: #28a745;
        }

        .summary {
            background: #e7f3ff;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #0066cc;
        }

        .summary h3 {
            color: #0066cc;
            margin-bottom: 15px;
        }

        .findings, .causes, .recommendations {
            margin: 20px 0;
        }

        .findings h3, .causes h3, .recommendations h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .findings ul, .causes ul, .recommendations ul {
            list-style: none;
            padding-left: 0;
        }

        .findings li, .causes li, .recommendations li {
            padding: 10px;
            margin: 8px 0;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-right: 8px;
        }

        .badge.high {
            background: #fee;
            color: #dc3545;
        }

        .badge.medium {
            background: #fff3cd;
            color: #856404;
        }

        .badge.low {
            background: #d4edda;
            color: #155724;
        }

        .badge.urgent {
            background: #dc3545;
            color: white;
        }

        .badge.short-term {
            background: #ffc107;
            color: #333;
        }

        .badge.long-term {
            background: #28a745;
            color: white;
        }

        /* Metadata */
        .metadata {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.9em;
            color: #666;
        }

        .metadata div {
            margin: 5px 0;
        }

        /* Error */
        .error {
            display: none;
            background: #fee;
            border: 1px solid #dc3545;
            color: #dc3545;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .error.active {
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🤖 InsightForge</h1>
            <p>AI-Powered Business Intelligence • Ask any business question in plain English</p>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Query Section -->
            <div class="query-section">
                <h2>💬 Ask a Question</h2>
                
                <textarea 
                    id="queryInput" 
                    placeholder="E.g., Why did revenue drop in December?"
                >Why did revenue drop in December 2024?</textarea>
                
                <button id="analyzeBtn" onclick="analyzeQuery()">
                    🚀 Analyze
                </button>

                <!-- Examples -->
                <div class="examples">
                    <h3>Try these examples:</h3>
                    <button class="example-btn" onclick="setQuery('What was revenue last month?')">
                        Revenue last month
                    </button>
                    <button class="example-btn" onclick="setQuery('Compare December vs November revenue')">
                        Compare periods
                    </button>
                    <button class="example-btn" onclick="setQuery('Why did sales drop?')">
                        Root cause analysis
                    </button>
                    <button class="example-btn" onclick="setQuery('Show revenue by product category')">
                        Breakdown by dimension
                    </button>
                </div>
            </div>

            <!-- Results Section -->
            <div class="results-section">
                <h2>📊 Analysis Results</h2>

                <!-- Loading State -->
                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p>Analyzing your query...</p>
                    
                    <div id="agentStatus" class="agent-status">
                        <div class="agent-item" id="agent-query">
                            <span class="icon">⏳</span> Query Understanding
                        </div>
                        <div class="agent-item" id="agent-planning">
                            <span class="icon">⏳</span> Planning
                        </div>
                        <div class="agent-item" id="agent-sql">
                            <span class="icon">⏳</span> SQL Execution
                        </div>
                        <div class="agent-item" id="agent-calc">
                            <span class="icon">⏳</span> Calculation
                        </div>
                        <div class="agent-item" id="agent-context">
                            <span class="icon">⏳</span> Context Search
                        </div>
                        <div class="agent-item" id="agent-synthesis">
                            <span class="icon">⏳</span> Synthesis
                        </div>
                    </div>
                </div>

                <!-- Error State -->
                <div id="error" class="error">
                    <strong>Error:</strong> <span id="errorMessage"></span>
                </div>

                <!-- Results -->
                <div id="results" class="result-card">
                    <!-- Metric Change -->
                    <div id="metricSection"></div>

                    <!-- Executive Summary -->
                    <div id="summarySection"></div>

                    <!-- Key Findings -->
                    <div id="findingsSection"></div>

                    <!-- Root Causes -->
                    <div id="causesSection"></div>

                    <!-- Recommendations -->
                    <div id="recommendationsSection"></div>

                    <!-- Metadata -->
                    <div id="metadataSection"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_URL = window.location.origin;

        // Set query from example
        function setQuery(query) {
            document.getElementById('queryInput').value = query;
        }

        // Mark agent as completed
        function markAgentComplete(agentId) {
            const element = document.getElementById(`agent-${agentId}`);
            if (element) {
                element.classList.add('completed');
                element.querySelector('.icon').textContent = '✅';
            }
        }

        // Main analyze function
        async function analyzeQuery() {
            const query = document.getElementById('queryInput').value.trim();
            
            if (!query) {
                alert('Please enter a question');
                return;
            }

            // Reset UI
            document.getElementById('loading').classList.add('active');
            document.getElementById('agentStatus').classList.add('active');
            document.getElementById('results').classList.remove('active');
            document.getElementById('error').classList.remove('active');
            document.getElementById('analyzeBtn').disabled = true;

            // Reset agent status
            ['query', 'planning', 'sql', 'calc', 'context', 'synthesis'].forEach(agent => {
                const el = document.getElementById(`agent-${agent}`);
                if (el) {
                    el.classList.remove('completed');
                    el.querySelector('.icon').textContent = '⏳';
                }
            });

            try {
                // Call API
                const response = await fetch(`${API_URL}/api/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: query })
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.statusText}`);
                }

                const data = await response.json();

                // Mark agents as complete
                if (data.agents_executed) {
                    data.agents_executed.forEach(agent => {
                        const agentMap = {
                            'query_understanding': 'query',
                            'planning': 'planning',
                            'sql_execution': 'sql',
                            'calculation': 'calc',
                            'context_search': 'context',
                            'synthesis': 'synthesis'
                        };
                        markAgentComplete(agentMap[agent] || agent);
                    });
                }

                // Display results
                displayResults(data);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('error').classList.add('active');
                document.getElementById('errorMessage').textContent = error.message;
            } finally {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('analyzeBtn').disabled = false;
            }
        }

        // Display results
        function displayResults(data) {
            // Show results section
            document.getElementById('results').classList.add('active');

            // Metric Change
            if (data.metric_change && data.metric_change.calculations) {
                const calc = data.metric_change.calculations;
                document.getElementById('metricSection').innerHTML = `
                    <div class="metric-change">
                        <h3>📈 Metric Change</h3>
                        <div class="metric-value ${calc.percentage_change < 0 ? 'negative' : 'positive'}">
                            ${calc.percentage_change > 0 ? '+' : ''}${calc.percentage_change.toFixed(1)}%
                        </div>
                        <div style="margin-top: 10px;">
                            <strong>Current:</strong> $${calc.current_value.toLocaleString()}<br>
                            <strong>Previous:</strong> $${calc.comparison_value.toLocaleString()}<br>
                            <strong>Change:</strong> $${Math.abs(calc.absolute_change).toLocaleString()}<br>
                            <strong>Status:</strong> ${calc.interpretation}
                        </div>
                    </div>
                `;
            }

            // Executive Summary
            if (data.executive_summary) {
                document.getElementById('summarySection').innerHTML = `
                    <div class="summary">
                        <h3>📝 Executive Summary</h3>
                        <p>${data.executive_summary}</p>
                    </div>
                `;
            }

            // Key Findings
            if (data.key_findings && data.key_findings.length > 0) {
                const findingsHTML = data.key_findings.map(f => `<li>• ${f}</li>`).join('');
                document.getElementById('findingsSection').innerHTML = `
                    <div class="findings">
                        <h3>🎯 Key Findings</h3>
                        <ul>${findingsHTML}</ul>
                    </div>
                `;
            }

            // Root Causes
            if (data.root_causes && data.root_causes.length > 0) {
                const causesHTML = data.root_causes.map(c => `
                    <li>
                        <span class="badge ${c.impact}">${c.impact.toUpperCase()}</span>
                        <strong>${c.cause}</strong><br>
                        <span style="color: #666;">${c.explanation}</span>
                    </li>
                `).join('');
                document.getElementById('causesSection').innerHTML = `
                    <div class="causes">
                        <h3>🔎 Root Causes</h3>
                        <ul>${causesHTML}</ul>
                    </div>
                `;
            }

            // Recommendations
            if (data.recommendations && data.recommendations.length > 0) {
                const recsHTML = data.recommendations.map(r => `
                    <li>
                        <span class="badge ${r.priority}">${r.priority.toUpperCase()}</span>
                        <strong>${r.action}</strong><br>
                        <span style="color: #666;">${r.rationale}</span>
                    </li>
                `).join('');
                document.getElementById('recommendationsSection').innerHTML = `
                    <div class="recommendations">
                        <h3>💡 Recommendations</h3>
                        <ul>${recsHTML}</ul>
                    </div>
                `;
            }

            // Metadata
            document.getElementById('metadataSection').innerHTML = `
                <div class="metadata">
                    <div><strong>Query ID:</strong> ${data.query_id}</div>
                    <div><strong>Query Type:</strong> ${data.query_type || 'N/A'}</div>
                    <div><strong>Execution Time:</strong> ${data.execution_time ? data.execution_time.toFixed(2) + 's' : 'N/A'}</div>
                    <div><strong>Agents Executed:</strong> ${data.agents_executed ? data.agents_executed.length : 0}</div>
                    <div><strong>Timestamp:</strong> ${new Date(data.timestamp).toLocaleString()}</div>
                </div>
            `;
        }

        // Allow Enter key to submit (Ctrl+Enter)
        document.getElementById('queryInput').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                analyzeQuery();
            }
        });

        // Check API health on load
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${API_URL}/health`);
                if (!response.ok) {
                    document.getElementById('error').classList.add('active');
                    document.getElementById('errorMessage').textContent = 
                        'API server not responding. Make sure backend is running on http://localhost:8000';
                }
            } catch (error) {
                document.getElementById('error').classList.add('active');
                document.getElementById('errorMessage').textContent = 
                    'Cannot connect to API. Start backend with: python backend/main.py';
            }
        });
    </script>
</body>
</html>
